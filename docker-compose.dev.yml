version: '3.8'
services:
  sast-integration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sast-integration
    restart: always
    ports:
      - '8083:8083'
    volumes:
      - "../workspace:/root/_project-repository/workspace:rw"
      - "../_scanned-project-files:/root/_scanned-project-files"
      - "../cache_data_sca:/root/.cache/"
    environment:
        APP_ENV: "development"
        DB_HOST: postgresdb
        DB_USER: what
        DB_PASSWORD: "what1234"
        DB_PORT: 5432
        DB_NAME: "semgrep"
        APP_PORT: "8083"
        PREFIX_PROJECT_FOLDER: "/_project-repository/workspace/"
        PREFIX_RESULT_FOLDER: "/_scanned-project-files/"
    networks:
      - compose_default
networks:
  compose_default:
    external: true
